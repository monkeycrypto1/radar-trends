name: Atualizar sinais de Google Trends

on:
  schedule:
    # 10:00 UTC = 07:00 horário de Brasília (sem horário de verão desde 2019)
    - cron: "0 10 * * 1"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  fetch-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar dados do Google Trends
        run: python fetch_trends.py

      - name: Publicar signals-trends.json atualizado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add signals-trends.json
          git diff --cached --quiet && echo "Nada mudou, pulando commit" || git commit -m "Atualiza sinais de Google Trends"
          git push
